# orca-coordinator config. Lives at ~/.config/orca-coordinator/config.yaml
# (or $ORCA_COORDINATOR_CONFIG). A project may add .orca-coordinator.yaml at
# its root to override keys. No secrets here: credentials stay in the OS keychain
# (secretRef: keychain:<service>), in an env var (env:NAME) or in a file (file:<path>).

schemaVersion: 2                  # managed by the coordinator: migrations bump it, keep it

person:
  name: <you>                      # how the coordinator addresses you
  github: <your-login>             # your GitHub login
  language: ""                    # optional: language the coordinator writes in for you (empty: no preference)
  tone: ""                        # optional: writing style (empty: no preference)
  uiTermsLanguage: en             # UI labels are quoted in this language, never translated
  voiceFile: null                 # optional file with samples of your review voice

paths:
  package: ~/src/orca-coordinator           # this clone (init fills it in)
  state: ~/.local/state/orca-coordinator    # state.md, board.json, reports/, lessons.md, metrics.tsv
  workspace: ~/code                         # the Orca workspace folder the coordinator runs in
  worktreeRoot: ~/worktrees                 # where Orca creates worktrees (init detects it; optional: when set, cleanup only touches worktrees under it)
  orca: /Applications/Orca.app/Contents/Resources/bin/orca

agents:
  # Empty agent = the agent Orca reports for the coordinator's terminal; set one only to pin it.
  coordinator: {agent: "", statusline: false}
  worker: {agent: "", extraArgs: "", permissionsFile: null}   # model: <id> here (or agents.coordinator/reader.model) wins over the level
  automation: {provider: ""}

# Intelligence levels: Light is cheapest, Max is smartest and costs most. Each role runs on a level;
# a level's model id is for the agent in use (empty = Orca's default). The coordinator fills the ids
# at session start; the panel's Settings picks the level per role.
models:
  levels: {light: "", standard: "", max: ""}
  roles: {coordinator: max, worker: standard, reader: light}

git:
  branchPattern: "{github}/{ticket-lower}"   # ticket worktree branches
  prTitlePattern: "{ticket}: {title}"
  protectedBranches: [main, master, develop]

# Git repositories only (the top of a work tree); a plain folder here is ignored with a warning.
# base: the default branch; init reads it from origin's HEAD.
# Advanced, optional: a repo may carry its own `ticketing` / `chat` CLI adapter block (same keys
# as under adapters) for the zero-model shell prechecks. The coordinator itself needs none of it:
# it uses whatever tools its agent has (MCP or CLI) and keeps a per-repo hint in state.md.
# The top-level adapters are the default for repos without one; a block with the same kind merges
# over the default, another kind starts from that tool's defaults. A repo's own
# .orca-coordinator.yaml (at its root) wins over both.
repos:
  - name: api
    path: ~/code/api
    base: main
    ticketing: {kind: jira, team: DEMO}
    chat: {draftOnlyChannels: [example-channel]}
  - {name: web, path: ~/code/web, base: main}  # uses the default adapters below

github:
  org: example-org
  reviewTeams: [example-org/platform]               # review requests to these teams count as yours
  skipRepos: [example-infra]                  # never reviewed
  botReviewer: ""                            # e.g. copilot-pull-request-reviewer
  requestBotReview: false                    # request that reviewer on every new PR

# Advanced, optional, config.yaml-only (the panel never shows or edits it). Ticketing and chat
# are detected by the coordinator; these blocks only pick the CLI adapter (adapters/<kind>/*.sh)
# the shell prechecks use, since they cannot call MCP. Leave kind: none to let the coordinator
# check on schedule with its own tools. Default for repos without their own block.
adapters:
  ticketing:
    kind: none                               # linear | jira | github | none
    team: DEMO                               # team key (Linear) or project key (Jira)
    todoStates: [Backlog, Todo, Triage]      # states that mean "not started"
    childLabel: ""                           # label the coordinator puts on child tickets it creates
    issueUrl: ""                             # optional: only the adapter's `url` verb uses it; board items carry their own url
  chat:
    kind: none                               # slack | none
    via: mcp:slack                           # the agent tool family used to read chat
    mentionIds: []                           # your user id and team group id, to detect mentions
    reviewChannels: []                       # channels where teammates ask for reviews
    draftOnlyChannels: []                    # channels the bot cannot post in: draft and tell the human
  flags:
    kind: none                               # unleash | none
    baseUrl: ""                              # e.g. https://flags.example.com
    project: default
    uiUrl: ""                                # e.g. https://flags.example.com/projects/default/features/{flag}
    secretRef: ""                           # keychain:<service> | env:<NAME> | file:<path>

# Optional team-process rules (rules/optional/*.md): planning-tracker, five-line-plan, drafts.
# [] = none (new installs). A config without this key keeps all of them (older installs).
rules:
  optional: []

sensitive: [commit, push, pr-open, pr-merge, pr-comment, ticket-write, chat-post, db, deploy, prod, delete-branch, settings-allow-deny]
queue: {max: 3, staleHours: 24}
budget: {stateBytes: 2500, reportHead: 2500, workerRetries: 1, maxWorkersPerTrigger: 3}

automations:
  enabled: false                             # init registers the jobs below only when true (or --automations)
  timezone: UTC
  graceMinutes: 720
  jobs:
    - {playbook: pr-comments, schedule: "0 9-19 * * 1-5", precheck: pr-comments, name: "Review comments on my PRs: propose replies and fixes"}
    - {playbook: pr-review, schedule: "15 9,12,15,18 * * 1-5", precheck: pr-review, name: "Review requests: prepare a review"}
    - {playbook: ticket-triage, schedule: "30 9 * * 1-5", precheck: ticket-triage, name: "New work items: triage and plan"}
    - {playbook: cleanup, schedule: "0 18 * * *", precheck: none, name: "Cleanup: close idle sessions, remove merged worktrees"}
    - {playbook: eval-weekly, schedule: "0 9 * * 1", precheck: eval-weekly, name: "Coordinator: weekly self-evaluation"}
    - {playbook: playbook-regression, schedule: "0 10 * * 1-5", precheck: playbook-regression, name: "Coordinator: playbook regression check"}

board:
  oncallLabel: ""                           # text of the priority badge on items flagged oncall; empty shows "Priority"
  repoColors: {}                             # optional {repo: "#hex"}; unset repos get a stable hash colour
